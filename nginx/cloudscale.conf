# ─── CloudScale Nginx Configuration ─────────────────────────────────────────
# Replace YOUR_DOMAIN with your actual domain, e.g. cloudscale.example.com
# This file goes in: /etc/nginx/sites-available/cloudscale
# Then: sudo ln -s /etc/nginx/sites-available/cloudscale /etc/nginx/sites-enabled/
# ─────────────────────────────────────────────────────────────────────────────

# Redirect HTTP → HTTPS for main domain
server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN *.YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

# Main app + wildcard subdomain deployments (HTTPS)
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN *.YOUR_DOMAIN;

    # SSL certificate (issued by certbot for *.YOUR_DOMAIN)
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve the main CloudScale React app (static files)
    location / {
        # Proxy everything to the Node.js server (which handles subdomain routing
        # and serves the Vite frontend via proxy on localhost:3000 in production build)
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # WebSocket support for HMR (if needed)
    location /ws {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $host;
    }

    # Large file uploads (e.g., env var pastes)
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
}
